spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Show full exception details
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-message=always

# Hibernate logging
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.hibernate=INFO

# Or for newer versions
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect

#Pacs connection
pacs.weasis.connector.url=http://103.133.215.182:9090/weasis-pacs-connector/weasis


# ===============================
# LOGGING CONFIG
# ===============================

logging.file.name=${catalina.base:.}/logs/hims.log

logging.level.root=INFO

# your package
logging.level.com=INFO

# Spring errors
logging.level.org.springframework=INFO

# Hibernate SQL (agar query dekhna hai)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Log pattern
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# file rotation
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30

# ===============================
# Actuator & HikariCP Diagnostics
# ===============================
# Enable required Actuator endpoints
management.endpoints.web.exposure.include=health,metrics,threaddump
management.endpoint.health.show-details=always

# CRITICAL: Hikari Leak Detection (in milliseconds)
spring.datasource.hikari.leak-detection-threshold=2000

# Connection pool timeout configurations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000